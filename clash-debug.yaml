  - name: 自动选择
    type: url-test
    proxies: []
    url: https://www.gstatic.com/generate_204
    interval: 300
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Auto.png
    filter: (?i)(香港|台湾|日本|新加坡|韩国|美国|Hong Kong|Taiwan|Japan|Singapore|Korea|USA|HK|TW|JP|SG|KR|US)
    include-all: true
  - name: 故障转移
    type: fallback
    proxies: []
    url: https://www.gstatic.com/generate_204
    interval: 300
    icon: https://raw.githubusercontent.com/fmz200/wool_scripts/main/icons/apps/FallBack.png
    filter: (?i)(香港|台湾|日本|新加坡|韩国|美国|Hong Kong|Taiwan|Japan|Singapore|Korea|USA|HK|TW|JP|SG|KR|US)
