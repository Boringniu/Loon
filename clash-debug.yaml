proxy-groups:
  - name: 云服务
    type: select
    proxies:
      - 自动选择
      - 故障转移
      - 负载均衡
      - 手动切换
      - 香港节点
      - 台湾节点
      - 美国节点
      - 新加坡节点
      - 韩国节点
      - 日本节点
