# Requires Mihomo / Clash Meta.  Enable System Proxy or TUN mode in the client.
mixed-port: 7890
socks-port: 7891
allow-lan: false
mode: rule
log-level: info
external-controller: 127.0.0.1:9090
unified-delay: true
tcp-concurrent: true
profile:
  store-selected: true
  store-fake-ip: true
dns:
  enable: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - +.ednovas.org
    - +.ednovas.cloud
    - +.lan
    - +.local
    - localhost
    - +.localhost
  ipv6: false
  use-hosts: true
  default-nameserver:
    - 223.5.5.5
    - 1.1.1.1
  proxy-server-nameserver:
    - https://1.1.1.1/dns-query
    - https://dns.alidns.com/dns-query
  nameserver:
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  respect-rules: true
tun:
  enable: true
  stack: system
  auto-route: true
  auto-detect-interface: true
  dns-hijack:
    - any:53
