# EdNovas 小火箭回国配置 · 缅甸
# 只保留五类节点：回国 / 香港 / 美国 / 新加坡 / 日本
# 模式保持「规则」。抖音只走回国。TikTok 国际版不走回国。

port: 7890
socks-port: 7891
allow-lan: true
mode: Rule
log-level: info
external-controller: 127.0.0.1:9090

dns:
  enable: true
  enhanced-mode: redir-host
  ipv6: false
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  nameserver-policy:
    '+.ednovas.org':
      - https://223.5.5.5/dns-query
    '+.ednovas.net':
      - https://223.5.5.5/dns-query
    '+.ednovas.cloud':
      - https://223.5.5.5/dns-query
